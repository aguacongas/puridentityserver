name: Certification OIDC (Local)

# Mode auto-hébergé : la suite openid/conformance-suite tourne EN DOCKER sur
# le runner, avec l'OP PurIdentityServer local derrière un nginx mTLS — aucune
# dépendance à l'infra hébergée de la Fondation ni à Render.
#
# Assurance conformité COURANTE et déterministe. Les NEUF plans sont joués en
# matrix (patron du job hébergé, issue #122 ; fapi2-message-signing ajouté par
# l'issue #164, formpost par l'issue #165, dynamic par l'issue #168) : chaque
# job boot son propre
# harness docker (isolé, aucun conflit d'alias) et exporte son artefact. Le job
# `report` fusionne les exports, génère le rapport statique et le PUBLIE sur
# GitHub Pages — ce workflow est le SEUL propriétaire de la publication Pages
# (issue #150), et SEULEMENT pour les runs sur `main` (push) ou lancés à la
# main (workflow_dispatch) : les PR publient uniquement leur rapport en
# artefact.
#
# Captures d'écran (#158, #161) : le job `capture` rejoue une fois par run les 30
# scénarios REVIEW contre l'OP local (Playwright) et téléverse l'artefact
# `certification-local-screenshots` ; les jobs `plan` le substituent au PNG de
# secours (SCREENSHOTS_DIR) et le job `report` intègre les images au rapport
# publié. Job BLOQUANT (issue #161) : une capture absente ou invalide fait
# échouer le run (aucun repli silencieux en CI).
#
# Sortie STRICTE (#130) : le code retour non nul du driver (modules FAILED,
# INTERRUPTED / did-not-complete, warnings inattendus) fait échouer le job
# plan — les exports et le garde-fou restent en `if: always()` pour préserver
# le rapport. Les modules REVIEW (relecture humaine, captures d'écran) restent
# tolérés, et les écarts de modules connus déclarés dans
# certification/expected-failures/<plan>.json sont classés « expected » par le
# driver (mode witness, idem run-plan.sh) : seule une régression inattendue
# fait échouer le job. `fail-fast: false` : les autres plans jouent quand même.
#
# Déclenchement : chaque merge sur `main` (sans filtre de chemins), chaque PR
# vers main touchant `certification/**`, et à la demande (workflow_dispatch,
# choix du plan). La version de la suite est résolue À L'EXÉCUTION : dernier
# tag `release-vX.Y.Z` listé par `git ls-remote` sur
# gitlab.com/openid/conformance-suite (échec = run en erreur, cf. issue #150).

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "Plan(s) local(aux) à jouer"
        type: choice
        required: false
        default: all
        options:
          - all
          - basic
          - implicit
          - hybrid
          - formpost
          - dynamic
          - ciba
          - fapi1
          - fapi2
          - fapi2-message-signing
  pull_request:
    branches: ["main"]
    paths:
      - "certification/**"
      - ".github/workflows/certification-local.yml"
  # Chaque merge sur main joue l'intégralité des plans : la certification
  # locale est l'assurance conformité courante du code réellement fusionné
  # (aucun filtre de chemins — cf. issue #150).
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  # {SUITEURL} / API du driver : accessible depuis l'hôte (alias ->127.0.0.1
  # posé par setup.sh) et depuis le conteneur (alias réseau docker).
  CONFORMANCE_SERVER: https://localhost.emobix.co.uk:8443/
  # {OPURL} : point d'entrée mTLS de l'OP, joignable par le navigateur HtmlUnit
  # (conteneur, via l'alias réseau `op`) — l'OP uvicorn est sur l'hôte.
  OP_URL: https://op:9443
  SUITE_URL: https://localhost.emobix.co.uk:8443/

concurrency:
  group: certification-local
  cancel-in-progress: true

jobs:
  matrix:
    name: Matrice des plans locaux
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Matrice des plans à jouer
        # Produit {"include":[{"plan":…,"selector":…,"file":…},…]} consommé par
        # le job matrix `plan`. Échec SEC sur un input inconnu.
        id: matrix
        env:
          PLAN_FILTER: ${{ inputs.plan || 'all' }}
        run: |
          set -euo pipefail
          # Selecteurs des plans : source unique partagee avec le lancement
          # local (certification/local/run-plan.sh) et le workflow herberge.
          source certification/selectors.sh
          plans=("${CERTIFICATION_PLANS[@]}")
          if [ "$PLAN_FILTER" != "all" ]; then
            selector_for "$PLAN_FILTER" > /dev/null || { echo "::error::Plan inconnu : $PLAN_FILTER"; exit 1; }
            plans=("$PLAN_FILTER")
          fi
          entries=()
          for p in "${plans[@]}"; do
            entries+=("{\"plan\":\"$p\",\"selector\":\"$(selector_for "$p")\",\"file\":\"$p.json\"}")
          done
          echo "matrix=$(printf '{"include":[%s]}' "$(IFS=,; echo "${entries[*]}")")" >> "$GITHUB_OUTPUT"

  capture:
    name: Captures d'écran réelles (Playwright)
    runs-on: ubuntu-latest
    # Bloquant (issue #161) : le script exige les 30 captures et sort en code
    # non nul dès qu'une scène échoue ; sans artefact, les jobs plan ne peuvent
    # pas fournir les captures REVIEW exigées et le run échoue.
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Résolution de la dernière release publiée de la suite
        # Même résolution que les jobs plan (issue #150) : le harness de la
        # capture joue la dernière release publiée de la suite.
        run: |
          latest=$(git ls-remote --tags https://gitlab.com/openid/conformance-suite.git "refs/tags/release-v*" \
            | python3 -c 'import re,sys; tags=[l.split("refs/tags/")[1].strip() for l in sys.stdin if "refs/tags/" in l]; tags=[t for t in tags if re.fullmatch(r"release-v\d+\.\d+\.\d+", t)]; tags.sort(key=lambda v: tuple(map(int, v.split("-v")[1].split(".")))); print(tags[-1] if tags else "")') || latest=""
          if [ -z "$latest" ]; then
            echo "::error::Dernière release de la suite injoignable (git ls-remote) — impossible de résoudre SUITE_VERSION"
            exit 1
          fi
          echo "SUITE_VERSION=$latest" >> "$GITHUB_ENV"
          echo "Suite de certification : $latest" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Installation de uv (OP local)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false

      - name: Bootstrap du harness local (suite docker + OP + nginx mTLS)
        run: bash certification/local/setup.sh

      - name: Captures d'écran réelles des modules de relecture (Playwright)
        # Rejoue les 30 scénarios REVIEW contre l'OP local (cert auto-signé :
        # ignore_https_errors ; issuer lu au discovery, redirect_uris de la
        # suite locale via --suite-url). Une seule exécution par run : les 9
        # jobs plan téléversent le résultat en artefact.
        run: |
          mkdir -p screenshots
          python3 -m pip install --disable-pip-version-check --quiet playwright "pyjwt[cryptography]"
          python3 -m playwright install --with-deps chromium
          python3 certification/capture_screenshots.py \
            --base-url https://localhost:9443 \
            --suite-url "$SUITE_URL" \
            --out screenshots
          ls -l screenshots

      - name: Upload des captures d'écran réelles
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: certification-local-screenshots
          path: screenshots/
          if-no-files-found: ignore

  plan:
    name: Plan ${{ matrix.plan }} (local)
    needs: [matrix, capture]
    # Sans `always()` : un job `capture` rouge (captures REVIEW manquantes,
    # issue #161) fait échouer le run et les plans sont ignorés — rien n'a à
    # jouer sans les captures exigées.
    if: ${{ needs.matrix.result == 'success' && needs.capture.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Secret du client d'administration de la certification : lu dans
      # l'environnement, jamais committé. Valeur locale par défaut (le job
      # local joue sur localhost) ; un secret GitHub permet de la surcharger.
      CERTIFICATION_ADMIN_CLIENT_SECRET: ${{ secrets.CERTIFICATION_ADMIN_CLIENT_SECRET || 'local-certification-admin-secret' }}
    strategy:
      # Chaque plan continue même si un autre échoue : le rapport consolidé
      # montre l'état complet du run. Le job lui-même échoue dès que le driver
      # sort en code non nul (FAILED / INTERRUPTED / warnings inattendus) —
      # voir le step Lancement.
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Résolution de la dernière release publiée de la suite
        # Dernier tag `release-vX.Y.Z` listé par `git ls-remote` sur
        # gitlab.com/openid/conformance-suite (cf. issue #150) : la suite est
        # toujours jouée dans sa dernière version publiée, par le même
        # transport que le clone (pas d'API REST annexe). Exporté via
        # $GITHUB_ENV : setup.sh lit SUITE_VERSION. Échec = run en erreur :
        # sans tag fiable, le run ne pourrait pas certifier la « dernière »
        # version.
        run: |
          latest=$(git ls-remote --tags https://gitlab.com/openid/conformance-suite.git "refs/tags/release-v*" \
            | python3 -c 'import re,sys; tags=[l.split("refs/tags/")[1].strip() for l in sys.stdin if "refs/tags/" in l]; tags=[t for t in tags if re.fullmatch(r"release-v\d+\.\d+\.\d+", t)]; tags.sort(key=lambda v: tuple(map(int, v.split("-v")[1].split(".")))); print(tags[-1] if tags else "")') || latest=""
          if [ -z "$latest" ]; then
            echo "::error::Dernière release de la suite injoignable (git ls-remote) — impossible de résoudre SUITE_VERSION"
            exit 1
          fi
          echo "SUITE_VERSION=$latest" >> "$GITHUB_ENV"
          echo "Suite de certification : $latest" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Installation de uv (OP local)
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Cache désactivé : le post-cleanup « Pruning cache » de setup-uv
          # échouait (exit 2) et passait le run en failure alors que le harness
          # tournait de bout en bout.
          enable-cache: false

      - name: Bootstrap du harness local (suite docker + OP + nginx mTLS)
        run: bash certification/local/setup.sh

      - name: Jeton d'administration (rotation des clés de signature)
        # Le patch `conformance-key-rotation` du driver appelle
        # `POST /signing-keys/rotate` sur l'OP juste avant de démarrer le
        # module `oidcc-server-rotate-keys` : la rotation des clés de
        # signature doit tomber ENTRE les deux relevés du JWKS comparés par
        # le module (le driver démarre le test sans délai après sa
        # configuration). Le jeton est obtenu par le grant client_credentials
        # (client seed `certification-admin`).
        run: |
          token="$(bash certification/local/admin-token.sh http://127.0.0.1:8000 certification/config.render.toml)"
          if [ -z "$token" ]; then
            echo "::error::jeton d'administration indisponible (client certification-admin)"
            exit 1
          fi
          echo "KEY_ROTATION_ENDPOINT=http://127.0.0.1:8000/signing-keys/rotate" >> "$GITHUB_ENV"
          echo "KEY_ROTATION_TOKEN=$token" >> "$GITHUB_ENV"
          echo "rotation des clés de signature armée"

      - name: Substitution des URLs dans le plan (mode local)
        run: |
          f="certification/plans/${{ matrix.file }}"
          sed -i "s#{OPURL}#${OP_URL}#g" "$f"
          sed -i "s#{SUITEURL}#${SUITE_URL}#g" "$f"
          grep -h '"match"' "$f" | sort -u

      - name: Dépendances Python du driver officiel (httpx)
        run: python3 -m pip install --disable-pip-version-check --quiet httpx

      - name: Patch du driver (5 patches, idem job hébergé)
        # Helper partage avec le lancement local (run-plan.sh) : application
        # idempotente des 5 patches + timeout parametrable.
        run: bash certification/local/prepare-suite.sh

      - name: Récupération des captures d'écran réelles (artefact capture)
        # Capture obligatoire (issue #161) : l'artefact existe dès que le job
        # `capture` est vert ; s'il manque malgré tout, cet échec est le bon
        # signal (le driver exigerait de toute façon chaque capture).
        uses: actions/download-artifact@v8
        with:
          name: certification-local-screenshots
          path: screenshots

      - name: Emplacement des captures d'écran
        # L'artefact peut être déposé à plat (screenshots/*.png) ou avec son
        # répertoire (screenshots/screenshots/*.png) : le driver ne lit que
        # le premier niveau, on aplatit donc au besoin. Aucun PNG = échec
        # explicite (captures REVIEW obligatoires, issue #161).
        run: |
          if [ ! -d screenshots ] || ! find screenshots -maxdepth 1 -name '*.png' -print -quit | grep -q .; then
            echo "::error::Aucune capture REVIEW disponible (artefact capture absent ou vide) — issue #161"
            exit 1
          fi
          find screenshots -mindepth 2 -type f -name '*.png' -exec mv -t screenshots/ {} + 2>/dev/null || true
          ls -l screenshots

      - name: Lancement du plan ${{ matrix.plan }}
        # Sortie stricte (#130) : le code retour du driver (1 sur modules
        # FAILED / INTERRUPTED / warnings inattendus, cf. `run-test-plan.py` —
        # analyze_plan_results + sys.exit) échoue le job. L'upload des exports
        # et le garde-fou restent en `if: always()` pour préserver le rapport
        # même en échec. Les modules REVIEW restent tolérés.
        env:
          # Mode dev OFFICIEL de la suite self-hosted : token=None (AUCUN header
          # Authorization) + vérification SSL désactivée (cert auto-signé).
          CONFORMANCE_DEV_MODE: "1"
          CONFORMANCE_TOKEN: ""
          DISABLE_SSL_VERIFY: "1"
          CONFORMANCE_MODULE_TIMEOUT: "600"
          # Captures réelles obligatoires produites par le job `capture`
          # (issue #161) : une capture absente ou invalide lève une erreur
          # fatale dans le driver et fait échouer le job.
          SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: |
          set +e
          mkdir -p results
          cd conformance-suite
          # Temoignage (mode witness) : les ecarts connus declares dans
          # certification/expected-failures/<plan>.json sont classes
          # « expected » par le driver — la sortie stricte ne porte que sur
          # les ecarts INATTENDUS (idem lancement local, run-plan.sh).
          expected_args=()
          expected_file="$GITHUB_WORKSPACE/certification/expected-failures/${{ matrix.plan }}.json"
          if [ -f "$expected_file" ]; then
            expected_args=(--expected-failures-file "$expected_file")
            echo "- ecarts attendus (witness) : certification/expected-failures/${{ matrix.plan }}.json" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          python3 scripts/run-test-plan.py \
            --export-dir "$GITHUB_WORKSPACE/results" \
            "${expected_args[@]}" \
            "${{ matrix.selector }}" \
            "$GITHUB_WORKSPACE/certification/plans/${{ matrix.file }}" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
          code=${PIPESTATUS[0]}
          echo "- exit code : $code" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$code" -ne 0 ]; then
            echo "plan ${{ matrix.plan }} en échec (modules FAILED, INTERRUPTED ou warnings inattendus)" | tee -a "$GITHUB_STEP_SUMMARY"
            exit "$code"
          fi

      - name: "Garde-fou : export du plan présent"
        # Un plan crashé (config invalide, variante refusée…) ne produit AUCUN
        # export : ce garde-fou l'annonce explicitement, y compris quand le
        # step Lancement a déjà échoué (`if: always()`), pour distinguer un
        # crash de démarrage d'un échec de modules (les exports de ces
        # derniers sont bien présents). Seule l'absence TOTALE d'export échoue
        # ici.
        if: always()
        run: |
          if [ -z "$(find results -mindepth 1 -print -quit 2>/dev/null)" ]; then
            echo "::error::Aucun export pour le plan ${{ matrix.plan }} local : harness crashé avant tout module"
            exit 1
          fi
          echo "Export du plan ${{ matrix.plan }} local présent : OK"

      - name: Upload des exports du plan
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: certification-local-results-${{ matrix.plan }}
          path: results/
          if-no-files-found: ignore

      - name: Journal de l'OP (diagnostic d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: certification-local-oplog-${{ matrix.plan }}
          path: .harness-local/op.log
          if-no-files-found: ignore

  report:
    name: Rapport statique local + GitHub Pages
    needs: [matrix, plan, capture]
    if: ${{ always() && needs.matrix.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Téléversement des exports de tous les plans
        uses: actions/download-artifact@v8
        with:
          pattern: certification-local-results-*
          merge-multiple: true

      - name: Fusion des exports dans results/
        run: |
          mkdir -p results
          find . -type f -name '*.zip' -not -path './results/*' -not -path './.git/*' \
            -exec mv -t results/ {} + 2>/dev/null || true
          ls -lh results | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Téléversement des captures d'écran réelles (artefact capture)
        # Capture échouée ou absente = pas d'artefact : le rapport est généré
        # sans images (report.py ignore un --screenshots vide) — jamais de
        # rupture du pipeline (issue #158).
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: certification-local-screenshots
          path: screenshots

      - name: Emplacement des captures d'écran
        # L'artefact peut être déposé à plat (screenshots/*.png) ou avec son
        # répertoire (screenshots/screenshots/*.png) : report.py ne lit que
        # le premier niveau, on aplatit donc au besoin.
        run: |
          if [ -d screenshots ]; then
            find screenshots -mindepth 2 -type f -name '*.png' -exec mv -t screenshots/ {} + 2>/dev/null || true
            ls -l screenshots
          else
            echo "Aucune capture : le rapport sera publié sans images."
          fi

      - name: Génération du rapport statique
        run: |
          mkdir -p screenshots
          python3 certification/report.py --results results --site _site --screenshots screenshots

      - name: Upload du rapport statique (artefact)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: certification-local-report
          path: _site/
          if-no-files-found: ignore

      # Publication GitHub Pages : SEULEMENT pour les runs sur `main` (push) ou
      # lancés à la main (workflow_dispatch) — jamais pour les PR (issue #150).
      - name: Configuration GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Publication du rapport sur GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy GitHub Pages
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v5
