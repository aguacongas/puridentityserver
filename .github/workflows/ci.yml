name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, type, tests) + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --extra sql --locked

      - name: Lint
        run: uv run --no-sync --no-build --locked ruff check .

      - name: Format
        run: uv run --no-sync --no-build --locked ruff format --check .

      - name: Type check (mypy strict)
        run: uv run --no-sync --no-build --locked mypy src/puridentityserver

      - name: Tests + couverture
        run: uv run --no-sync --no-build --locked pytest --cov-report=xml:coverage/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: (github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}

      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.3.0
        if: (github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}

      - name: SonarCloud — refuser toute nouvelle issue
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          pr="${{ github.event.pull_request.number }}"
          new_issues=$(curl -s "https://sonarcloud.io/api/issues/search?componentKeys=aguacongas_puridentityserver&pullRequest=${pr}&resolved=false&statuses=OPEN,CONFIRMED,REOPENED" | jq -r '.total // 0')
          echo "Nouvelles issues SonarCloud sur la PR ${pr} : ${new_issues}"
          if [ "${new_issues}" -gt 0 ]; then
            echo "::error::SonarCloud rapporte ${new_issues} nouvelle(s) issue(s) sur cette PR."
            exit 1
          fi