name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, type, tests) + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --extra sql --locked

      - name: Lint
        run: uv run --no-sync --no-build --locked ruff check .

      - name: Format
        run: uv run --no-sync --no-build --locked ruff format --check .

      - name: Type check (mypy strict)
        run: uv run --no-sync --no-build --locked mypy src/puridentityserver

      - name: Tests + couverture
        run: uv run --no-sync --no-build --locked pytest --cov-report=xml:coverage/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        if: (github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}

      - name: SonarCloud Quality Gate
        if: (github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          pr="${{ github.event.pull_request.number }}"
          if [ -z "${pr}" ]; then
            branch="${{ github.ref_name }}"
            status_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=aguacongas_puridentityserver&branch=${branch}"
          else
            status_url="https://sonarcloud.io/api/qualitygates/project_status?projectKey=aguacongas_puridentityserver&pullRequest=${pr}"
          fi
          echo "Polling: ${status_url}"
          for i in $(seq 1 60); do
            status=$(curl -s -H "Authorization: Bearer ${{ secrets.SONAR_SECRET }}" "${status_url}" | jq -r '.projectStatus.status // "PENDING"')
            echo "Tentative ${i}/60 : ${status}"
            if [ "${status}" != "PENDING" ] && [ "${status}" != "null" ]; then
              if [ "${status}" != "OK" ]; then
                echo "::error::Quality gate SonarCloud : ${status}"
                exit 1
              fi
              echo "Quality gate SonarCloud : OK"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timeout en attendant le quality gate SonarCloud"
          exit 1

      - name: SonarCloud — refuser toute nouvelle issue
        if: github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          pr="${{ github.event.pull_request.number }}"
          new_issues=$(curl -s "https://sonarcloud.io/api/issues/search?componentKeys=aguacongas_puridentityserver&pullRequest=${pr}&resolved=false&statuses=OPEN,CONFIRMED,REOPENED" | jq -r '.total // 0')
          echo "Nouvelles issues SonarCloud sur la PR ${pr} : ${new_issues}"
          if [ "${new_issues}" -gt 0 ]; then
            echo "::error::SonarCloud rapporte ${new_issues} nouvelle(s) issue(s) sur cette PR."
            exit 1
          fi