name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  quality:
    name: Qualité (lint, type, tests) + SonarCloud
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --extra sql --locked

      - name: Lint
        run: uv run --no-sync --no-build --locked ruff check .

      - name: Format
        run: uv run --no-sync --no-build --locked ruff format --check .

      - name: Type check (mypy strict)
        run: uv run --no-sync --no-build --locked mypy src/puridentityserver

      - name: Tests + couverture
        run: uv run --no-sync --no-build --locked pytest --cov-report=xml:coverage/coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        if: (github.event_name == 'push') || (github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_SECRET }}