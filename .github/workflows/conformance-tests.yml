name: Rejeu certification OIDC (tests conformance)

# Rejoue localement les checks de la suite officielle openid/conformance-suite
# (tests marqués `conformance`, exclus du gate `ci.yml` par `-m "not conformance"`).
# Déclenché sur chaque PR vers main, à la demande (workflow_dispatch) et chaque nuit.
#
# Chaque plan (fichier de tests) tourne dans un job matrix distinct : le rejeu
# complet passe de ~23 min séquentielles à la durée du plan le plus long
# (~10 min), chaque job produisant son propre rapport JUnit. Un job de
# consolidation (`report`) les fusionne et publie le commentaire unique de la
# PR (sur le modèle du Quality Gate SonarCloud).
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: read
  pull-requests: write

jobs:
  conformance:
    name: Rejeu ${{ matrix.plan }}
    runs-on: ubuntu-latest
    strategy:
      # Chaque plan continue même si un autre échoue : le rapport consolidé
      # doit montrer l'état complet du rejeu, pas s'arrêter au premier plan rouge.
      fail-fast: false
      matrix:
        include:
          - plan: basic
            file: test_plan_basic.py
          - plan: implicit
            file: test_plan_implicit.py
          - plan: hybrid
            file: test_plan_hybrid.py
          - plan: fapi-ciba
            file: test_plan_fapi_ciba.py
          - plan: fapi1
            file: test_plan_fapi1.py
          - plan: fapi2
            file: test_plan_fapi2.py
          - plan: redirect-reauth
            file: test_redirect_reauth.py

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --extra dev --extra sql --locked

      # `--no-cov` : le sous-ensemble conformance ne couvre pas le seuil de
      # 80 % du gate (la couverture est mesurée par `ci.yml` sur la suite
      # complète). Pas de `-q` : le résumé `N passed, M deselected` est la
      # preuve visible que les checks ont bien été rejoués. `--junitxml`
      # produit le détail par check consolidé dans le job `report`.
      - name: Tests conformance (${{ matrix.plan }})
        run: >-
          uv run --no-sync --no-build --locked pytest -m conformance
          tests/conformance/${{ matrix.file }}
          --no-cov -p no:cacheprovider
          --junitxml=junit-${{ matrix.plan }}.xml

      - name: Upload du rapport JUnit
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.plan }}
          path: junit-${{ matrix.plan }}.xml
          if-no-files-found: error

  report:
    name: Rapport consolidé du rejeu
    needs: conformance
    # `if: always()` : le rapport est publié même quand un plan échoue —
    # c'est précisément ce qu'il faut voir sans ouvrir les logs.
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Téléversement des rapports JUnit des plans
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          merge-multiple: true

      - name: Rapport du rejeu
        # `scripts/conformance_report.py` n'utilise que la bibliothèque
        # standard : pas de `uv sync` nécessaire dans ce job de
        # consolidation.
        run: >-
          python3 scripts/conformance_report.py junit-*.xml
          --markdown conformance-report.md

      # Commentaire unique de la PR (créé puis mis à jour à chaque run) :
      # `pull-requests: write` au niveau workflow, `continue-on-error` pour
      # les PRs de fork où le token reste en lecture seule.
      - name: Publier le rapport dans la PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- conformance-report -->'
          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq "[.[] | select(.body | startswith(\"$marker\")) | .id][0] // empty")
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" \
              -F body=@conformance-report.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" \
              -F body=@conformance-report.md > /dev/null
          fi
          echo "Rapport publié dans la PR #$PR_NUMBER (commentaire $comment_id)" >> "$GITHUB_STEP_SUMMARY"
