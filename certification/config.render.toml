# Configuration de l'instance Render dédiée à la certification OIDC
# (suite officielle openid/conformance-suite pilotée par
# `.github/workflows/certification.yml`).
#
# Particularités vs `config.toml` :
# - `storage_type = "sql"` + `storage_dsn = "sqlite:///puridentityserver.db"` :
#   persistance SQLite (fichier sur le disque éphémère Render).
#   Les clients enregistrés dynamiquement (RFC 7591) survivent aux cold starts
#   du plan gratuit (sommeil/proc) au sein d'un run — c'est ce qui permet au
#   `DELETE /register/{client_id}` final (RFC 7592, unregister) de renvoyer 204
#   au lieu d'un 404 `invalid_client`. Le workflow redéploie l'instance avant
#   chaque run (disque recréé) : l'état reste donc vierge à chaque exécution.
# - `registration_initial_access_token_mode = "disabled"` : enregistrement
#   dynamique OUVERT (RFC 7591) pour que la suite puisse s'auto-enregistrer
#   (`client_registration = dynamic_client`). À ne JAMAIS utiliser hors de
#   cette instance de démonstration/qualité.
# - `clients_seed` FAPI (issue #113) : 4 clients statiques obligatoires pour
#   les plans fapi1/fapi2 (la suite n'expose aucune variante
#   `client_registration` sur ces plans : client statique forcé).
#   JWKS public (private_key_jwt, PS256, RSA 2048) côté OP ; la clé privée
#   correspondante vit dans certification/plans/fapi1.json / fapi2.json
#   (config client de la suite). redirect_uris = callback de la suite (alias
#   du plan) + variante à query des modules « second client »
#   (`AddRedirectUriQuerySuffix` = ?dummy1=lorem&dummy2=ipsum).
# - `tls_client_certificate_bound_access_tokens = true` sur les 2 clients
#   FAPI1 uniquement (issue #144, RFC 8705) : la suite FAPI1 impose le
#   sender-constrain mTLS (certificat client exigé au /token, claim
#   `cnf.x5t#S256` sur les access tokens, binding validé à la ressource).
#   Les clients FAPI2 restent sans flag : ils utilisent DPoP et ne
#   présentent aucun certificat — un flag global casserait le plan fapi2.
# L'issuer public est surchargé par `PURIDENTITYSERVER_ISSUER` (blueprint
# `render.yaml`) : https://puridentityserver-certification.onrender.com

[settings]
issuer = "http://127.0.0.1:8000"
base_url = ""
host = "0.0.0.0"
port = 8000

storage_type = "sql"
storage_dsn = "sqlite:///puridentityserver.db"

# Clés de signature RSA 2048 (au lieu du défaut 4096) : la certification
# rejoue la rotation des clés de signature (module oidcc-server-rotate-keys),
# qui génère une paire par publication du JWKS. 2048 bits reste conforme aux
# profils FAPI (RSA >= 2048) et rend la génération ~8x plus rapide.
jwks_key_size = 2048

registration_enabled = true
registration_initial_access_token_mode = "disabled"

# API d'administration (issue #194) : l'autorisation est branchee sur le
# claim `client_id` (porte par tout access token) plutot que sur le scope
# `admin` - ce scope n'etant pas enregistre, il serait impossible a un
# client d'obtenir un jeton d'administration. Seul le client seed
# `certification-admin` (ci-dessous) satisfait alors la regle.
admin_required_claim = "client_id"
admin_required_claim_values = ["certification-admin"]

# Subject types (OIDC Core 1.0 §8.1, ESID 1.0 §4) : seed de dérivation
# des `sub` pairwise/ephemeral exigé par les modules
# oidcc-registration-sector-* du plan dynamic (un client `pairwise`
# sans seed serveur serait refusé `invalid_client_metadata`).
subject_pairwise_seed = "certification-subject-seed"

# CIBA (issue #50) : backchannel_authentication_endpoint + approbation
# automatisée de la suite (plan fapi-ciba-id1-test-plan, witness).
ciba_enabled = true
ciba_approval_enabled = true

# Resource server intégré (RFC 8707, FAPI-R-6.2.1) : GET /protected-resource,
# pointé par `resource.resourceUrl` du plan ciba.json — la suite y vérifie
# l'access token (en-tête Bearer, `x-fapi-interaction-id` échoyé, Date,
# content-type JSON ; 200 attendu, 401 sans jeton).
protected_resource_enabled = true

# Reverse proxy : reconstruction de l'URL publique (claim `htu` des preuves
# DPoP, RFC 9449 §4.3). Instance Render ET harness local derrière un nginx
# de terminaison TLS : sans ce réglage, `htu` (`https://op:9443/…` côté
# suite) est comparé à l'URL interne du backend (`http://host.docker.
# internal:8000/…`) et toutes les preuves sont rejetées (issue #153).
trust_proxy_headers = true

# Login obligatoire à l'endpoint /authorize (OIDC Core 1.0 §3.1.2.1) : la
# demande non authentifiée est redirigée vers /login (refresh de session du
# navigateur interne de la suite), `prompt=none` reçoit `login_required`.
# Sans ce réglage l'utilisateur anonyme reçoit un code (subject vide -> `sub`
# invalide : les modules de la certification échouent).
require_login = true

# Durées de vie calées sur les modules de la suite (issue #113) :
# - `authorization_code_ttl_seconds` = 60 : le module expired-auth-code
#   expire son code avant le délai d'attente de la suite (défaut 600 s :
#   le code était encore valable à l'usage, `ServerAllowedExpiredAuthCode`) ;
# - `par_ttl_seconds` = 30 (validateur 5..600, `expires_in` ≥ 5 s exigé
#   par `CheckForPARResponseExpiresIn`) : le module
#   par-attempt-to-use-expired-request_uri dort le temps de `expires_in`
#   puis termine vers t≈31 s — sous les 60 s de grâce de
#   `conformance-screenshots.patch` (avec 90 s le placeholder n'était
#   jamais rempli et le run restait bloqué sur ce module).
# Invariant maintenu : par_ttl (30) < authorization_code_ttl (60).
authorization_code_ttl_seconds = 60
par_ttl_seconds = 30

