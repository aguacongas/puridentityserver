# Client d'administration de la certification (issue #194) : le harnais
# obtient un access token (grant client_credentials) dont le claim
# `client_id` vaut `certification-admin`, puis appelle
# `POST /signing-keys/rotate` pour faire pivoter les cles de signature de
# l'OP entre les deux releves du JWKS du module `oidcc-server-rotate-keys`.
# Le secret n'est PAS commite : il est lu dans l'environnement du serveur
# (variable `CERTIFICATION_ADMIN_CLIENT_SECRET` - tableau de bord Render pour
# l'instance hebergee, variable du job CI pour le harnais local).
[[settings.clients_seed]]
client_id = "certification-admin"
client_secret = "${CERTIFICATION_ADMIN_CLIENT_SECRET}"
redirect_uris = []
scopes = "openid"
client_type = "confidential"

# Clients statiques FAPI (issue #113) : voir l'en-tête.
