client_id = "puridentityserver-fapi1-client"
redirect_uris = [
    "https://www.certification.openid.net/test/a/puridentityserver-fapi1/callback",
    "https://www.certification.openid.net/test/a/puridentityserver-fapi1/callback?dummy1=lorem&dummy2=ipsum",
]
