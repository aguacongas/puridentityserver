# nginx reverse proxy TLS mTLS devant l'instance Render de certification,
# pour Oracle Cloud Always Free (OCI) — voir docs/certification-proxy.md.
#
# Remplacer {HOSTNAME} par le sous-domaine DuckDNS (ex.
# puridentity-op-cert.duckdns.org), puis :
#   sudo cp nginx-oracle.conf /etc/nginx/conf.d/puridentity.conf
#   sudo sed -i 's/{HOSTNAME}/puridentity-op-cert.duckdns.org/g' /etc/nginx/conf.d/puridentity.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cible : nginx 1.20 (Ubuntu 22.04 de la VM, `listen … http2` ; la syntaxe
# `http2 on;` exige nginx >= 1.25.1).

server {
    listen 443 ssl http2;
    server_name {HOSTNAME};

    ssl_certificate     /etc/letsencrypt/live/{HOSTNAME}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/{HOSTNAME}/privkey.pem;

    # TLS 1.2/1.3 : seules les suites a secret perfect forward (ECDHE) sont
    # autorisees par FAPI1 - toute suite RSA (sans PFS) fait echouer
    # DisallowInsecureCipher. Alignement sur certification/local/nginx-mtls.conf.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Certificat client demandé au handshake mais NON bloquant : les
    # navigateurs de la suite (authorize) passent sans cert, l'OP tranche
    # via le flag tls_client_certificate_bound_access_tokens.
    # optional_no_ca accepte les certs auto-signés de la suite.
    ssl_verify_client optional_no_ca;

    client_max_body_size 1m;

    # Buffers de requête 32k : la trust chain envoyée dans la query du plan
    # federation (OpenID Federation 1.1 §12.1) pèse ~9 Ko — au-delà du défaut
    # (4 x 8k), nginx répond 414 Request-URI Too Large et le module
    # `with-jar-and-get-and-trust-chain` est INTERRUPTED.
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;

    # Buffers de réponse alignés sur la requête : une entête upstream trop
    # grande est coupée -> le client voit un 502 Bad Gateway (module
    # `with-jar-and-post-and-trust-chain`). Mêmes valeurs que
    # certification/local/nginx-mtls.conf.
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    proxy_read_timeout 300s;

    location / {
        proxy_pass https://puridentityserver-certification.onrender.com;
        proxy_ssl_server_name on;
        proxy_set_header Host puridentityserver-certification.onrender.com;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # PEM URL-encode ($ssl_client_escaped_cert, %0A) — l'OP decode via
        # _normalize_header_value (infrastructure/client_tls.py). Le PEM brut
        # ($ssl_client_cert) corromprait la requete HTTP (retours a la ligne
        # litteraux) — voir certification/local/nginx-mtls.conf.
        proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
        proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
    }
}
