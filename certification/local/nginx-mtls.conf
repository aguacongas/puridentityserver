# Termination mTLS (RFC 8705) devant l'OP PurIdentityServer, pour le harness
# local de certification (certification-local.yml).
#
# Rôle : écouter en TLS sur9443 avec certificat client OPTIONNEL
# (ssl_verify_client optional_no_ca), extraire le certificat présenté (s'il y en
# a un) et le transmettre à l'OP en en-têtes, tout en proxifiant le reste vers
# l'OP uvicorn de l'hôte.
#
# Pourquoi optional_no_ca : les plans fapi1 mélangent des modules mTLS
# (holder-of-key, le client envoie son cert) et des modules private_key_jwt (le
# client n'envoie AUCUN cert). L'OP doit donc recevoir le cert quand il est
# présent, et simplement l'absence d'en-tête quand il ne l'est pas — jamais un
# rejet TLS au niveau du proxy.
#
# Piège corrompant (voir run local du 2026-10-13) : $ssl_client_cert contient le
# PEM avec des retours à la ligne LITTÉRAUX ; posé tel quel dans un en-tête
# proxy, il corrompt la requête HTTP vers uvicorn (« Invalid HTTP request
# received » -> corps vide -> la suite juge la réponse token non-JSON). On
# utilise donc $ssl_client_escaped_cert (PEM URL-encodé, %0A) que l'OP dé-encode
# (client_tls.py, _normalize_header_value -> unquote).
#
# Le certificat serveur ci-dessous est auto-signé (généré par setup.sh) : la
# suite (HtmlUnit) et le driver tournent avec DISABLE_SSL_VERIFY / confiance
# auto-signée, aucun besoin d'une CA réelle.

worker_processes 1;
events { worker_connections 1024; }
http {
  server {
    listen 9443 ssl;
    server_name op;

    ssl_certificate     /etc/nginx/tls/nginx.crt;
    ssl_certificate_key /etc/nginx/tls/nginx.key;

    # Certificat client optionnel, non vérifié contre une CA (auto-signés de la
    # suite). On extrait juste le PEM présenté pour le passer à l'OP.
    ssl_verify_client optional_no_ca;
    ssl_protocols TLSv1.2 TLSv1.3;
    # FAPI1 exige au moins AES128-GCM ; on reste RSA-compatible (les clients de
    # la suite sont RSA 2048, pas de courbe EC).
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;

    # Le client_assertion (JWT signé) alourdit l'en-tête Authorization : buffers
    # larges pour ne pas tronquer la requête token.
    client_header_buffer_size 32k;
    large_client_header_buffers 4 32k;
    proxy_read_timeout 120s;

    location / {
      # L'OP uvicorn tourne sur l'hôte (0.0.0.0:8000) ; host.docker.internal
      # (ajouté par setup.sh via --add-host ...:host-gateway) y pointe depuis le
      # conteneur. Sans variable : résolution à l'amorçage via /etc/hosts.
      proxy_pass http://host.docker.internal:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # PEM URL-encodé (pas de newline brute) + sujet one-line RFC 4514.
      proxy_set_header X-SSL-Client-Cert $ssl_client_escaped_cert;
      proxy_set_header X-SSL-Client-S-DN $ssl_client_s_dn;
      proxy_pass_request_headers on;
    }
  }
}
