# Réglages du client de démonstration Authorization Code + PKCE (refresh_app).
#
# Ce fichier est chargé automatiquement au démarrage de l'application
# (``app.py``). Les variables d'environnement ``OIDC_*`` restent prioritaires.
# Pour surcharger le fichier : ``OIDC_SETTINGS_FILE=config.local.toml``

[settings]
issuer = "http://127.0.0.1:8000"
client_id = "sample-refresh-client"
redirect_uri = "http://127.0.0.1:5174/callback"
host = "127.0.0.1"
port = 5174