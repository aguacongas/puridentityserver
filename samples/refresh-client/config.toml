# Configuration du serveur pour le test manuel du refresh token (RFC 6749 §6).
#
# Chargée automatiquement par `smoke_test.py` via
# `PURIDENTITYSERVER_SETTINGS_FILE`. Port dédié (8101) pour ne pas
# entrer en conflit avec un serveur dev (8000) ou introspect (8100).

[settings]
issuer = "http://127.0.0.1:8101"
base_url = ""
host = "127.0.0.1"
port = 8101
jwks_algorithms = ["RS256"]

[[settings.clients_seed]]
client_id = "sample-refresh-client"
redirect_uris = ["http://127.0.0.1:5174/callback"]
scopes = "openid profile email offline_access"
client_type = "public"