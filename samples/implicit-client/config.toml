# Réglages du client de démonstration Implicit flow (OIDC Core 1.0 §3.2).
# Chaque clé est surchargeable via l'environnement préfixé `OIDC_`
# (voir README.md) ou via le fichier passé dans `OIDC_SETTINGS_FILE`.

[settings]
issuer = "http://127.0.0.1:8000"
client_id = "sample-implicit-client"
redirect_uri = "http://127.0.0.1:5175/callback"
post_logout_redirect_uri = "http://127.0.0.1:5175/post-logout"
host = "127.0.0.1"
port = 5175