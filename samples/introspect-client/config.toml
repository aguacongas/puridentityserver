# Configuration du serveur pour le test manuel de l'introspection (RFC 7662).
#
# Chargée automatiquement par `introspect_test.py` via
# `PURIDENTITYSERVER_SETTINGS_FILE`. Port dédié (8100) pour ne pas
# entrer en conflit avec un serveur dev (8000).

[settings]
issuer = "http://127.0.0.1:8100"
base_url = ""
host = "127.0.0.1"
port = 8100
jwks_algorithms = ["RS256"]

[[settings.clients_seed]]
client_id = "sample-introspect-client"
redirect_uris = ["http://127.0.0.1:8100/callback"]
scopes = "openid profile"
client_type = "confidential"
client_secret = "introspect-demo-secret"