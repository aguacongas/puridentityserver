# Render Blueprint — instance de certification publique (PurIdentityServer).
#
# Service web gratuit "Spark" avec stockage SQLite (`storage_type = "sql"` dans
# `certification/config.render.toml`) : l'état (clients enregistrés, sessions,
# clés) est écrit sur le disque éphémère de Render et survit aux cold starts
# au sein d'un run de certification — indispensable pour que l'unregister
# final de la suite (RFC 7592) renvoie 204 au lieu d'un 404. Le disque est
# recréé à chaque déploiement : le workflow redéploie l'instance avant chaque
# run, donc l'état reste vierge d'une exécution à l'autre. Cette instance sert
# de cible à la suite de certification OIDC lancée par le workflow
# `.github/workflows/certification.yml` (l'OP doit être joignable à distance
# par la suite, qui tourne dans le runner GitHub).
#
# Procédure : importer ce blueprint depuis le dashboard Render
# (New -> Blueprint -> repo GitHub), puis récupérer l'URL du Deploy Hook du
# service (Settings -> Deploy Hook) et la stocker en secret GitHub
# `RENDER_DEPLOY_HOOK_URL`. Le nom du service détermine l'URL publique :
# https://puridentityserver-certification.onrender.com

services:
  - type: web
    name: puridentityserver-certification
    runtime: docker
    repo: https://github.com/aguacongas/puridentityserver
    plan: free
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /.well-known/openid-configuration
    autoDeploy: false
    envVars:
      # Derrière le reverse proxy mTLS (issue #133), l'URL publique de l'OP
      # est le proxy — la suite et les clients voient l'issuer du proxy. La
      # variable GitHub `CERTIFICATION_OP_URL` doit pointer sur cette même URL.
      # Sans ce réglage, l'issuer annoncé (Render) ne correspond pas à l'URL
      # publique et l'étape "Attente de l'OP" du workflow `certification.yml`
      # (contrôle `issuer == OP_URL`) n'aboutit jamais.
      - key: PURIDENTITYSERVER_ISSUER
        value: https://puridentity-op-cert.duckdns.org
      - key: PURIDENTITYSERVER_BASE_URL
        value: https://puridentity-op-cert.duckdns.org
      - key: PURIDENTITYSERVER_HOST
        value: 0.0.0.0
      - key: PURIDENTITYSERVER_SETTINGS_FILE
        value: /app/certification/config.render.toml
      # Secret du client d'administration de la certification (issue #194) :
      # lu par le seed `certification-admin` (`${CERTIFICATION_ADMIN_CLIENT_SECRET}`)
      # et par le job CI pour appeler `POST /signing-keys/rotate`. Valeur a
      # definir dans le tableau de bord Render (jamais commitee) - elle doit
      # etre identique au secret GitHub `CERTIFICATION_ADMIN_CLIENT_SECRET`.
      - key: CERTIFICATION_ADMIN_CLIENT_SECRET
        sync: false