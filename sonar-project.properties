# Métadonnées du projet (SonarCloud)
sonar.projectKey=aguacongas_puridentityserver
sonar.organization=aguacongas
sonar.host.url=https://sonarcloud.io

# Sources et tests
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Python
sonar.python.version=3

# Couverture (pytest-cov -> coverage/coverage.xml)
sonar.python.coverage.reportPaths=coverage/coverage.xml

# ---------------------------------------------------------------------------
# Exceptions documentées (SonarCloud)
# ---------------------------------------------------------------------------
# githubactions:S8541 (règle "supply chain" beta) : le flag --no-build est
# incompatible avec l'installation du projet racine (editable, build hatchling
# de notre propre code, donc contrôlé et de confiance). Les commandes `uv run`
# portent `--no-build --no-sync` ; seul le `uv sync` initial construit le projet
# local, jamais des dépendances externes (toutes installées en binaire via uv.lock).
sonar.issue.ignore.multicriteria.uv_build.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.uv_build.resource=.github/workflows/ci.yml