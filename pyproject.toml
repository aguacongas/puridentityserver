[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "puridentityserver"
version = "0.1.0"
description = "Serveur OpenID Connect (OIDC) implémentant la spec, bâti sur FastAPI et PyJWT"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Olivier Lefebvre", email = "aguacongas@gmail.com" }]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pyjwt[crypto]>=2.14.0",
    "cryptography>=50.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.18",
    "fastapi-users[jwt,sqlalchemy]>=13.0.0",
]

[project.optional-dependencies]
sql = [
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.30.0",
    "fastapi-users[jwt,sqlalchemy]>=13.0.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.7",
    "mypy>=2.3.1",
    "types-pyjwt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/puridentityserver"]

# ---------------------------------------------------------------------------
# Ruff : lint + format (le standard moderne qui remplace black + flake8 + isort)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]
fix = true

[tool.ruff.lint]
preview = true
select = [
    "E",       # pycodestyle errors
    "W",       # pycodestyle warnings
    "F",       # pyflakes (undefined names, unused imports...)
    "I",       # isort (imports triés)
    "N",       # pep8-naming (nommage)
    "UP",      # pyupgrade (syntaxe moderne)
    "B",       # flake8-bugbear (pièges connus)
    "A",       # flake8-builtins (masquage de builtins)
    "C4",      # flake8-comprehensions
    "C90",     # mccabe — complexité cyclomatique (aligné sur SonarCloud S3776, seuil 10)
    "S",       # bandit (sécurité)
    "SIM",     # flake8-simplify (code simplifiable)
    "T",       # flake8-print (interdit print en prod)
    "ANN",     # flake8-annotations (typage explicite obligatoire)
    "PERF",    # pyperf (petites perf non ambiguës)
    "RUF",     # règles spécifiques ruff
    "D",       # pydocstyle — docstrings obligatoires (convention google)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["assert", "undocumented-public-module", "undocumented-public-class", "undocumented-public-method", "undocumented-public-function", "hardcoded-password-string", "hardcoded-password-func-arg"]  # assert + docstrings non requis dans les tests, S105/S106 pour valeurs de référence (jetons, secrets) dans les assertions
"src/puridentityserver/infrastructure/jwe.py" = ["suspicious-insecure-hash-usage"]  # SHA-1 imposé par RFC 7518 §4.3 pour RSA-OAEP (cf. NOSONAR(S4790) in situ)
"scripts/**" = ["print", "suspicious-subprocess-import", "subprocess-without-shell-equals-true"]  # script de dev : print + subprocess ok
"samples/**/smoke_test.py" = ["assert", "print", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "try-except-in-loop", "hardcoded-password-string", "hardcoded-password-func-arg"]  # smoke test : print + assert + subprocess + polling retries + valeurs de référence (token/secret client démo)
"samples/smoke_common.py" = ["print", "suspicious-subprocess-import", "subprocess-without-shell-equals-true", "try-except-in-loop"]  # helper des smoke tests : affiche l'état, lance le serveur en sous-processus (liste d'arguments, pas de shell), sonde le port
"samples/**/client.py" = ["print"]  # démo CLI : affichage de résultats

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

# ---------------------------------------------------------------------------
# mypy : typage strict
# ---------------------------------------------------------------------------
[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# pytest + couverture
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "-q --cov=puridentityserver --cov=puridentityprotocol --cov=puridentityadmin --cov=puridentityfull --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = [
    "src/puridentityserver",
    "src/puridentityprotocol",
    "src/puridentityadmin",
    "src/puridentityfull",
]
branch = true
omit = ["src/puridentityserver/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
