country = "FR"

# comptes de connexion (email + password) pour le login navigateur. La clé
# (subject) réutilise celle de `users_seed` pour le pont identité ⊕ user store.
# Surchargeables en bloc via `PURIDENTITYSERVER_IDENTITY_SEED_USERS` (JSON).

[settings.identity_seed_users.alice]
email = "alice@example.com"
password = "password"

[settings.identity_seed_users.bob]
email = "bob@example.com"
password = "password"

# seed IdentityResources (OIDC Core §5.4) : scopes identité et claims exposés
# quand le scope est accordé au jeton.
#
# ⚠ DÉROGATION : contrairement aux autres seeds, rien n'est obligatoire ici —
# les resources par défaut (openid, profile, email, address, phone,
# offline_access) sont seedées QUOI QU'IL ARRIVE, même sans configuration.
# Elles alimentent `scopes_supported` / `claims_supported` du discovery et le
# filtrage des claims de /userinfo par scope accordé.
#
# `[[settings.identity_resources_seed]]` sert à AJOUTER des resources en plus
# des défauts (un nom déjà porté par un défaut le surcharge — ex. personnaliser
# les claims du scope "profile"). Champs d'une entrée :
# - name                        : nom du scope (ex. "profile", "custom")
# - display_name                : libellé humain (facultatif)
# - user_claims                 : claims utilisateur rendus accessibles avec le
#                                 scope (liste, facultative)
# - show_in_discovery_document  : publier le scope dans `scopes_supported`
#                                 (facultatif, défaut true)
# Surchargeable en bloc via `PURIDENTITYSERVER_IDENTITY_RESOURCES_SEED` (JSON,
# même sémantique additive : défauts + entrées de la liste).

# Exemple (non actif) : ajouter une resource custom en plus des défauts :
# [[settings.identity_resources_seed]]
# name = "custom"
# display_name = "Claims métier"
# user_claims = ["employee_id", "department"]
# show_in_discovery_document = true

[[settings.clients_seed]]
client_id = "sample-pkce-client"
redirect_uris = ["http://127.0.0.1:5173/callback"]
post_logout_redirect_uris = ["http://127.0.0.1:5173/post-logout"]
scopes = "openid profile email"
client_type = "public"

# clients des samples (démo / tests manuels) :
# - sample-implicit-client  : flow Implicit (RFC 6749 §4.2 / OIDC §3.2),
#                             jetons remis dans le fragment, nonce obligatoire
# - sample-hybrid-client    : flow Hybrid (OIDC §3.3), code + jetons en fragment
#                             puis échange du code au /token avec PKCE
# - sample-refresh-client   : échange code + rotation du refresh token (RFC 6749 §6)
# - sample-cc-client        : grant client_credentials, machine à machine (RFC 6749 §4.4)
# - sample-introspect-client : introspection / révocation (RFC 7662 / 7009)
# - registration-client     : aucun client seed — le client est créé dynamiquement
#                             via /register (RFC 7591/7592, voir
#                             `registration_initial_access_tokens` ci-dessus)
# - par-client              : client PAR (RFC 9126) avec `par_required = true` —
#                             /authorize direct rejeté, le flow doit passer par
#                             POST /par puis /authorize?client_id+request_uri
# - spa-client              : SPA statique sans callback (tous les flows OIDC),
#                             redirection à la racine http://127.0.0.1:5177/ ;
#                             `require_consent = true` : la 1re autorisation de
#                             l'utilisateur passe par la page /consent puis est
#                             mémorisée (scopes accordés ré-utilisés ensuite)
# → les smokes tests de ces samples PASSERT une configuration spécifique (port
#   dédié + ce client) via un fichier temporaire ; ici ils sont aussi enregistrés
#   pour pouvoir lancer le serveur par défaut et tester manuellement les samples.

[[settings.clients_seed]]
client_id = "sample-implicit-client"
redirect_uris = ["http://127.0.0.1:5175/callback"]
post_logout_redirect_uris = ["http://127.0.0.1:5175/post-logout"]
scopes = "openid profile email"
client_type = "public"

[[settings.clients_seed]]
client_id = "sample-hybrid-client"
redirect_uris = ["http://127.0.0.1:5176/callback"]
post_logout_redirect_uris = ["http://127.0.0.1:5176/post-logout"]
scopes = "openid profile email"
client_type = "public"

[[settings.clients_seed]]
client_id = "sample-refresh-client"
redirect_uris = ["http://127.0.0.1:5174/callback"]
post_logout_redirect_uris = ["http://127.0.0.1:5174/post-logout"]
scopes = "openid profile email offline_access"
client_type = "public"

[[settings.clients_seed]]
client_id = "sample-cc-client"
scopes = "openid profile"
client_type = "confidential"
client_secret = "cc-demo-secret"

[[settings.clients_seed]]
client_id = "sample-introspect-client"
redirect_uris = ["http://127.0.0.1:8000/callback"]
scopes = "openid profile"
client_type = "confidential"
client_secret = "introspect-demo-secret"

# client du sample Device Authorization Grant (RFC 8628) : flow sans
# redirect_uri, adapté aux appareils à entrées limitées (TV, CLI…).
# Le client est public (pas de secret) ; le smoke test génère une
# configuration spécifique (port dédié) via samples/smoke_common.py.

[[settings.clients_seed]]
client_id = "sample-device-client"
scopes = "openid profile"
client_type = "public"

# client du sample Pushed Authorization Request (RFC 9126) : flow back-channel
# (POST /par) avec par_required = true — /authorize direct rejeté.
# Le smoke test génère une configuration spécifique (port dédié) via
# samples/smoke_common.py.

[[settings.clients_seed]]
client_id = "sample-par-client"
redirect_uris = ["http://127.0.0.1:8105/callback"]
scopes = "openid profile email"
client_type = "public"
par_required = true

[[settings.clients_seed]]
client_id = "sample-spa-client"
redirect_uris = [
    "http://127.0.0.1:5177/",
    "http://localhost:5177/",
]
post_logout_redirect_uris = [
    "http://127.0.0.1:5177/",
    "http://localhost:5177/",
]
web_origins = [
    "http://127.0.0.1:5177",
    "http://localhost:5177",
]
scopes = "openid profile email offline_access"
client_type = "public"
require_consent = true