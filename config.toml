# Configuration par défaut du serveur PurIdentityServer (chargée à la racine du dépôt).
#
# Les valeurs ci-dessous sont des défauts de démonstration : elles sont
# surchargées par les variables d'environnement `PURIDENTITYSERVER_*`. Pour
# personnaliser, copiez ce fichier et pointez le serveur dessus via
# `PURIDENTITYSERVER_SETTINGS_FILE`.

# seeds clients enregistrés au démarrage du serveur :
# - client_id      : identifiant du client
# - redirect_uris  : URI de redirection autorisées pour le flow
# - scopes         : scopes accordés au client (séparés par des espaces)
# - client_type    : "public" (Authorization Code + PKCE, sans secret) ou
#                    "confidential" (échange de tokens via client_secret)
# - client_secret  : secret du client (haché SHA-256 en base, jamais stocké
#                    en clair) — facultatif pour un client "public"
# Durées de vie accordées au client (facultatives ; le défaut serveur
# s'applique si absentes) :
# - session_lifetime_seconds          : cookie de session (par défaut
#                                       `identity_jwt_lifetime_seconds`)
# - access_token_lifetime_seconds     : id_token + access_token (par défaut
#                                       `access_token_ttl_seconds`)
# - authorization_code_lifetime_seconds : code d'autorisation (par défaut
#                                         `authorization_code_ttl_seconds`)

[settings]

# serveur HTTP / OIDC :
# - issuer : oidc.issuer retourné dans le document de découverte
# - base_url : base utilisée pour construire les URLs publiques (découverte,
#   redirections) ; vide = l'`issuer` ci-dessus
# - host / port : adresse d'écoute du serveur
# Surchargeables via `PURIDENTITYSERVER_ISSUER`, `PURIDENTITYSERVER_BASE_URL`,
# `PURIDENTITYSERVER_HOST`, `PURIDENTITYSERVER_PORT`.
issuer = "http://127.0.0.1:8000"
base_url = ""
host = "127.0.0.1"
port = 8000

# Stockage de l'état persistant du serveur : clés de signature, clients,
# codes d'autorisation et utilisateurs.
# - storage_type : "memory" (perdu au redémarrage) ou "sql"
# - storage_dsn : DSN de persistance pour `storage_type = "sql"`
# Surchargeables via `PURIDENTITYSERVER_STORAGE_TYPE`,
# `PURIDENTITYSERVER_STORAGE_DSN`.

# JWKS (RFC 7517) : génération et rotation des clés de signature des tokens.
# - jwks_key_size : taille RSA (bits), ignorée pour les clés EC
# - jwks_algorithms : algorithmes de signature publiés au JWKS
# - jwks_rotation_days : rotation d'une clé de signature par jour J
# - jwks_grace_period_days : clés rotées encore acceptées à la vérification
# Surchargeables via `PURIDENTITYSERVER_JWKS_KEY_SIZE`,
# `PURIDENTITYSERVER_JWKS_ALGORITHMS` (liste séparée par des virgules),
# `PURIDENTITYSERVER_JWKS_ROTATION_DAYS`, `PURIDENTITYSERVER_JWKS_GRACE_PERIOD_DAYS`.
storage_type = "memory"
storage_dsn = "sqlite:///puridentityserver.db"
jwks_key_size = 4096
jwks_algorithms = ["RS256", "RS384", "RS512", "PS256", "PS384", "PS512", "ES256", "ES384", "ES512"]
jwks_rotation_days = 90
jwks_grace_period_days = 7

# OAuth 2.0 / OIDC : durées de vie par défaut du serveur, appliquées quand le
# client ne précise pas les siennes (`access_token_lifetime_seconds` /
# `authorization_code_lifetime_seconds` dans `clients_seed`). L'id_token et
# l'access_token partagent la même durée. Surchargeables via
# `PURIDENTITYSERVER_AUTHORIZATION_CODE_TTL_SECONDS` / `PURIDENTITYSERVER_ACCESS_TOKEN_TTL_SECONDS`.
authorization_code_ttl_seconds = 600
access_token_ttl_seconds = 3600

# identité (FastAPI Users, spike) : durée par défaut du cookie et comptes de
# connexion démo. Surchargeables via `PURIDENTITYSERVER_IDENTITY_*` (env) ou une
# entrée `.env`. Le cookie de session est signé RS256 avec une clé rotative
# dédiée (`KeyUse.SESSION`) stockée au même endroit que les clés de signature
# des tokens : aucun secret statique (cookies, reset, verify) n'est nécessaire.
# La durée effective peut être surchargée par client via `session_lifetime_seconds`
# dans `[[settings.clients_seed]]`.
identity_jwt_lifetime_seconds = 3600

# seed utilisateurs (user store) : clé = subject (sub), valeur = claims
# exposés selon les scopes accordés au jeton (openid > sub, profile >
# identité, email, address, phone). Sujets = utilisateurs, jamais des
# clients ; les clés "alice" / "bob" sont recopiées par le pont identité
# sous l'UUID FastAPI Users correspondant au même email (`DEMO_USERS`).
# Surchargeable en bloc via `PURIDENTITYSERVER_USERS_SEED` (JSON).

[settings.users_seed.alice]
name = "Alice Martin"
family_name = "Martin"
given_name = "Alice"
middle_name = "Marie"
nickname = "alice"
preferred_username = "alice-martin"
profile = "https://example.com/alice-martin"
picture = "https://example.com/alice-martin.jpg"
website = "https://alice.example.com"
gender = "female"
birthdate = "1990-04-12"
zoneinfo = "Europe/Paris"
locale = "fr-FR"
updated_at = 1738000000
roles = ["admin", "member"]
email = "alice.martin@example.com"
email_verified = true
phone_number = "+33142000000"
phone_number_verified = true

[settings.users_seed.alice.address]
formatted = "12 rue de la Paix, 75002 Paris, France"
street_address = "12 rue de la Paix"
locality = "Paris"
postal_code = "75002"
country = "FR"

[settings.users_seed.bob]
name = "Bob Durand"
family_name = "Durand"
given_name = "Bob"
nickname = "bob"
preferred_username = "bob-durand"
profile = "https://example.com/bob-durand"
picture = "https://example.com/bob-durand.jpg"
gender = "male"
birthdate = "1985-11-03"
zoneinfo = "Europe/Paris"
locale = "fr-FR"
updated_at = 1739000000
roles = ["member"]
email = "bob.durand@example.com"
email_verified = true
phone_number = "+33142000001"
phone_number_verified = true

[settings.users_seed.bob.address]
formatted = "4 avenue Jean Moulin, 75014 Paris, France"
street_address = "4 avenue Jean Moulin"
locality = "Paris"
postal_code = "75014"
country = "FR"

# comptes de connexion (email + password) pour le login navigateur. La clé
# (subject) réutilise celle de `users_seed` pour le pont identité ⊕ user store.
# Surchargeables en bloc via `PURIDENTITYSERVER_IDENTITY_SEED_USERS` (JSON).

[settings.identity_seed_users.alice]
email = "alice@example.com"
password = "password"

[settings.identity_seed_users.bob]
email = "bob@example.com"
password = "password"

[[settings.clients_seed]]
client_id = "sample-pkce-client"
redirect_uris = ["http://127.0.0.1:5173/callback"]
scopes = "openid profile email"
client_type = "public"